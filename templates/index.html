<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My To-Do</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="todo-app">
    <h1>My To-Do</h1>

    <nav class="filters" aria-label="Фильтр задач">
      <button type="button" class="active" data-filter="all">Все</button>
      <button type="button" data-filter="active">Активные</button>
      <button type="button" data-filter="completed">Выполненные</button>
    </nav>

    <form id="task-form" class="task-form">
      <label class="visually-hidden" for="task-title">Новая задача</label>
      <input id="task-title" name="title" type="text" maxlength="300"
             placeholder="Что нужно сделать?" autocomplete="off" required>
      <button type="submit" aria-label="Добавить задачу">+</button>
    </form>

    <p id="error-message" class="error-message" role="alert" hidden></p>
    <p id="empty-message" class="empty-message">Задач пока нет</p>
    <ul id="task-list" class="task-list" aria-live="polite"></ul>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
